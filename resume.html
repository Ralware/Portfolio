<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume | Your Name</title>
  <meta name="description" content="View and download the resume of Your Name.">
  <link rel="icon" type="image/svg+xml" href="assets/placeholder.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/space.css">
  <script>
    // Pure dark mode.
    document.documentElement.dataset.theme = "dark";
    try { localStorage.setItem("portfolio-theme", "dark"); } catch (e) {}
  </script>
</head>
<body>
  <div id="loader" aria-hidden="true">
    <div class="l-inner"><span class="l-logo">yourname.</span><div class="l-bar"><div class="l-fill"></div></div></div>
  </div>

  <header id="site-nav" style="position:relative;z-index:20"></header>
  <div class="nav-spacer"></div>

  <main style="position:relative">
    <div id="lightrays" aria-hidden="true"></div>
    <div class="wrap-4xl" style="position:relative;z-index:1">
      <div class="resume-top">
        <h1>Resume</h1>
        <div style="display:flex;gap:.5rem">
          <a class="btn" id="resume-open" href="assets/resume.pdf" target="_blank" rel="noopener">Open as PDF</a>
          <a class="btn solid" id="resume-dl" href="assets/resume.pdf" download="Your-Name-Resume.pdf">Download</a>
        </div>
      </div>
      <div class="resume-card">
        <img src="assets/resume-preview.svg" alt="Your Name | Resume preview" onerror="this.src='assets/placeholder.svg'">
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/space.js"></script>
  <script>
    // Resume paths come from the central data file.
    document.addEventListener("DOMContentLoaded", function () {
      var file = portfolioData.personal.resumeFile || "assets/resume.pdf";
      document.getElementById("resume-open").href = file;
      var dl = document.getElementById("resume-dl");
      dl.href = file;
      dl.setAttribute("download", "Your-Name-Resume.pdf");
      document.title = "Resume | " + portfolioData.personal.fullName;
    });
  </script>
</body>
</html>
